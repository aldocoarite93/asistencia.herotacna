<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Hero Tacna — Asistencia</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:16px}
.app{max-width:480px;margin:0 auto;background:#fff;border-radius:16px;padding:20px;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid #eee}
.logo-icon{width:46px;height:46px;min-width:46px;background:#1D9E75;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:26px}
.logo-text{font-size:17px;font-weight:600;color:#111}
.logo-sub{font-size:13px;color:#888;margin-top:2px}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #ddd;border-top-color:#1D9E75;border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:4px}
@keyframes spin{to{transform:rotate(360deg)}}
.status-dot{width:8px;height:8px;border-radius:50%;background:#1D9E75;display:inline-block;margin-right:5px}
.blk{margin-bottom:20px}
.blk-label{font-size:14px;font-weight:500;color:#555;margin-bottom:8px;display:block}
.blk select,.blk input[type=date]{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:10px;font-size:16px;background:#fff;color:#111;font-family:inherit;appearance:none;-webkit-appearance:none}
.blk select:focus,.blk input[type=date]:focus{outline:none;border-color:#1D9E75}
.turno-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbtn{padding:14px 10px;border:1px solid #ddd;border-radius:10px;background:#fff;color:#333;font-size:14px;font-weight:500;cursor:pointer;text-align:center;font-family:inherit;min-height:58px;touch-action:manipulation;transition:all 0.15s}
.tbtn small{font-size:11px;display:block;margin-top:3px;opacity:0.75;font-weight:400}
.tbtn.active{background:#1D9E75;color:#fff;border-color:#1D9E75}
.tbtn:active{opacity:0.8}
.th{display:grid;grid-template-columns:1fr 62px 62px 62px;padding:10px 12px;background:#f7f7f7;border-radius:10px;font-size:12px;font-weight:500;color:#777;margin-bottom:4px;text-align:center}
.th span:first-child{text-align:left}
.arow{display:grid;grid-template-columns:1fr 62px 62px 62px;align-items:center;padding:12px;border-bottom:1px solid #f0f0f0;min-height:54px}
.arow:last-child{border-bottom:none}
.aname{font-size:14px;color:#111;line-height:1.3}
.acod{font-size:12px;color:#999;margin-top:2px}
.rcell{display:flex;justify-content:center;align-items:center}
.aft-btn{width:44px;height:44px;border-radius:10px;border:1.5px solid #ddd;background:#fff;font-size:17px;font-weight:800;cursor:pointer;font-family:inherit;color:#bbb;touch-action:manipulation;transition:all 0.15s}
.aft-btn.a-on{background:#1D9E75;border-color:#1D9E75;color:#fff}
.aft-btn.f-on{background:#EF4444;border-color:#EF4444;color:#fff}
.aft-btn.t-on{background:#F0A0C0;border-color:#F0A0C0;color:#fff}
.rcell input[type=radio]{width:22px;height:22px;accent-color:#1D9E75;cursor:pointer;touch-action:manipulation}
.tabla-wrap{border:1px solid #eee;border-radius:10px;overflow:hidden;margin-top:8px}
.no-sel{text-align:center;padding:28px;color:#aaa;font-size:14px}
.sec-title{font-size:16px;font-weight:600;color:#111;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.cnt-badge{font-size:12px;padding:3px 10px;border-radius:20px;background:#e8f8f2;color:#0F6E56;font-weight:500}
.tog-box{display:flex;align-items:center;justify-content:space-between;padding:14px;border:1px solid #eee;border-radius:10px;background:#fff}
.tog-label{font-size:15px;font-weight:500;color:#111}
.tog-sub{font-size:12px;color:#999;margin-top:3px}
.tog-pair{display:flex;gap:8px}
.tog-btn{padding:9px 20px;border-radius:24px;border:1px solid #ddd;font-size:14px;cursor:pointer;background:#f5f5f5;color:#777;font-family:inherit;touch-action:manipulation;min-height:42px;transition:all 0.15s}
.tog-btn.t-si{background:#1D9E75;color:#fff;border-color:#1D9E75}
.tog-btn.t-no{background:#fff0f0;color:#c0392b;border-color:#f5c6c6}
.extra-box{margin-top:10px;border:1px solid #eee;border-radius:10px;padding:14px;background:#fafafa}
.search-input{width:100%;padding:13px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;background:#fff;color:#111;font-family:inherit;margin-bottom:6px}
.search-input:focus{outline:none;border-color:#1D9E75}
.drop-list{background:#fff;border:1px solid #ddd;border-radius:10px;max-height:200px;overflow-y:auto;margin-bottom:10px;display:none}
.drop-row{display:flex;align-items:center;justify-content:space-between;padding:13px 14px;border-bottom:1px solid #f0f0f0;cursor:pointer;touch-action:manipulation;min-height:52px}
.drop-row:last-child{border-bottom:none}
.drop-row:active{background:#f7faf8}
.drop-name{font-size:14px;color:#111;font-weight:500}
.drop-cod{font-size:12px;color:#999;margin-top:2px}
.turno-pill{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid #ddd;background:#f5f5f5;color:#333;font-weight:500;white-space:nowrap;margin-left:8px;flex-shrink:0}
.inv-item{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e0f0e8;border-radius:10px;padding:10px 12px;margin-bottom:8px;min-height:48px}
.inv-left{display:flex;flex-direction:column;flex-shrink:0;width:120px}
.inv-name{font-size:14px;font-weight:500;color:#111;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inv-cod{font-size:11px;color:#999;margin-top:1px}
.inv-pill{font-size:11px;padding:4px 9px;border-radius:6px;border:1px solid #ddd;background:#f5f5f5;color:#333;font-weight:500;white-space:nowrap;flex-shrink:0}
.nota-wrap{flex:1;min-width:0}
.nota-display{width:100%;height:32px;padding:7px 10px;border:1px solid transparent;border-radius:8px;font-size:13px;font-family:inherit;color:#999;background:transparent;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;line-height:18px;display:flex;align-items:center}
.nota-display.has-text{color:#555}
.nota-input-inv{width:100%;height:32px;padding:7px 10px;border:1px solid #1D9E75;border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:#111;display:none;outline:none}
.del-btn{width:32px;height:32px;min-width:32px;border-radius:8px;border:1px solid #fdd;background:#fff5f5;color:#e74c3c;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.del-btn:active{background:#fdd}
.empty-list{text-align:center;padding:16px;color:#bbb;font-size:13px;border:1px dashed #ddd;border-radius:10px}
.add-btn{display:flex;align-items:center;gap:6px;font-size:14px;color:#1D9E75;cursor:pointer;padding:8px 0 2px;background:none;border:none;font-family:inherit;touch-action:manipulation;font-weight:500}
.pr-card{background:#fff;border:1px solid #eee;border-radius:10px;padding:12px;margin-bottom:10px;display:flex;flex-direction:column;gap:10px}
.pr-card input{width:100%;padding:12px 14px;border:1px solid #ddd;border-radius:10px;font-size:15px;font-family:inherit;background:#fff;color:#111}
.pr-card input:focus{outline:none;border-color:#1D9E75}
.pr-bottom{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radio-box{display:flex;flex-direction:column;gap:10px;padding:12px;border:1px solid #eee;border-radius:10px;background:#fafafa}
.radio-box label{display:flex;align-items:center;gap:8px;font-size:15px;color:#111;cursor:pointer;min-height:28px;touch-action:manipulation}
.radio-box input[type=radio]{width:20px;height:20px;accent-color:#1D9E75;touch-action:manipulation;cursor:pointer}
.nota-pr{width:100%;padding:10px 12px;border:1px solid #eee;border-radius:10px;font-size:14px;font-family:inherit;background:#fafafa;color:#111;resize:none;height:66px}
.nota-pr:focus{outline:none;border-color:#1D9E75}
.submit-btn{width:100%;padding:16px;background:#1D9E75;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:20px;font-family:inherit;touch-action:manipulation;min-height:56px;transition:all 0.2s}
.submit-btn:active{opacity:0.85}
.submit-btn:disabled{opacity:0.6;cursor:not-allowed}
.ok-msg{text-align:center;padding:16px;background:#e8f8f2;border-radius:12px;color:#0F6E56;font-size:15px;font-weight:500;margin-top:14px;border:1px solid #c8ead9}
</style>
</head>
<body>
<div class="app">
  <div class="logo">
    <div class="logo-icon">🏀</div>
    <div>
      <div class="logo-text">Hero Tacna Academia</div>
      <div class="logo-sub" id="ds"><span class="spinner"></span>Cargando alumnos...</div>
    </div>
  </div>

  <div class="blk">
    <span class="blk-label">📅 Fecha de clase</span>
    <input type="date" id="fecha">
  </div>

  <div class="blk">
    <span class="blk-label">👤 Profesor</span>
    <select id="profesor">
      <option value="">Seleccionar profesor...</option>
      <option>Dante Pastor</option>
      <option>Pedro Liendo</option>
      <option>Mauricio Gutiérrez</option>
    </select>
  </div>

  <div class="blk">
    <span class="blk-label">🕐 Turno</span>
    <div class="turno-grid">
      <button class="tbtn" onclick="selTurno('TA1',this)">TA1<small>LMV 3:30–4:30pm · Camelias</small></button>
      <button class="tbtn" onclick="selTurno('TA2',this)">TA2<small>LMV 4:30–6:00pm · Camelias</small></button>
      <button class="tbtn" onclick="selTurno('TB1',this)">TB1<small>MJS 4:00–5:00pm · Camelias</small></button>
      <button class="tbtn" onclick="selTurno('TB2',this)">TB2<small>MJS 5:00–6:00pm · Camelias</small></button>
      <button class="tbtn" onclick="selTurno('TC1',this)">TC1<small>MJS 4:00–5:00pm · Coliseo</small></button>
      <button class="tbtn" onclick="selTurno('TC2',this)">TC2<small>MJS 5:00–6:00pm · Coliseo</small></button>
    </div>
  </div>

  <div class="blk">
    <div class="sec-title">📋 Asistencia <span class="cnt-badge" id="badge"></span></div>
    <div class="th"><span>Alumno</span><span>✅ A</span><span>❌ F</span><span>🕐 T</span></div>
    <div class="tabla-wrap" id="tabla">
      <div class="no-sel">⬆️ Selecciona un turno arriba</div>
    </div>
  </div>

  <div class="blk">
    <div class="tog-box">
      <div>
        <div class="tog-label">👥 Alumno invitado</div>
        <div class="tog-sub">Recupera clase en otro turno</div>
      </div>
      <div class="tog-pair">
        <button class="tog-btn t-no" id="inv-no" onclick="togSec('inv','no')">No</button>
        <button class="tog-btn" id="inv-si" onclick="togSec('inv','si')">Sí</button>
      </div>
    </div>
    <div class="extra-box" id="sec-inv" style="display:none">
      <input class="search-input" type="text" id="buscador"
        placeholder="🔍 Buscar alumno por nombre o código..."
        oninput="filtrar()" autocomplete="off">
      <div class="drop-list" id="dropdown"></div>
      <div id="lista-inv">
        <div class="empty-list">Busca y toca un alumno para agregarlo</div>
      </div>
    </div>
  </div>

  <div class="blk">
    <div class="tog-box">
      <div>
        <div class="tog-label">⭐ Clase de prueba</div>
        <div class="tog-sub">Niño/a que viene por primera vez</div>
      </div>
      <div class="tog-pair">
        <button class="tog-btn t-no" id="pr-no" onclick="togSec('pr','no')">No</button>
        <button class="tog-btn" id="pr-si" onclick="togSec('pr','si')">Sí</button>
      </div>
    </div>
    <div class="extra-box" id="sec-pr" style="display:none">
      <div id="rows-pr"></div>
      <button class="add-btn" onclick="addPr()">➕ Agregar otro alumno prueba</button>
    </div>
  </div>

  <button class="submit-btn" id="sbtn" onclick="enviar()">📤 Enviar asistencia</button>
  <div id="resultado"></div>
</div>

<script>
const API="https://script.google.com/macros/s/AKfycbw0OmFTAkOl85NCF5RO-XLvDGU9qedhEr_OskfqZtz5JujMhziD8zTrdwFENvSr1sQugw/exec";
let APT={},TODOS=[],turno=null,prN=0,invitados=[];

async function init(){
  try{
    const r=await fetch(API+'?app=alumnos');
    const d=await r.json();
    TODOS=d;APT={};
    d.forEach(a=>{const t=(a.turno||"").toUpperCase();if(!APT[t])APT[t]=[];APT[t].push(a);});
    document.getElementById('ds').innerHTML='<span class="status-dot"></span>'+d.length+' alumnos cargados';
    if(turno)renderTabla(turno);
  }catch(e){
    document.getElementById('ds').innerHTML='⚠️ Sin conexión — intenta de nuevo';
  }
}

function selTurno(t,btn){
  turno=t;
  document.querySelectorAll('.tbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderTabla(t);
}

function renderTabla(t){
  const lista=APT[t]||[];
  document.getElementById('badge').textContent=lista.length+' alumnos';
  if(!lista.length){document.getElementById('tabla').innerHTML='<div class="no-sel">Sin alumnos en este turno</div>';return;}
  document.getElementById('tabla').innerHTML=lista.map((a,i)=>`
    <div class="arow">
      <div><div class="aname">${(a.nom||'').split(' ').slice(0,3).join(' ')}</div><div class="acod">${a.cod}</div></div>
      <div class="rcell"><button type="button" class="aft-btn" id="a${i}-A" onclick="marcarAFT(${i},'A')">A</button></div>
      <div class="rcell"><button type="button" class="aft-btn" id="a${i}-F" onclick="marcarAFT(${i},'F')">F</button></div>
      <div class="rcell"><button type="button" class="aft-btn" id="a${i}-T" onclick="marcarAFT(${i},'T')">T</button></div>
    </div>`).join('');
  ESTADO_ASIS={};
}

function togSec(tipo,val){
  document.getElementById(tipo+'-si').className='tog-btn'+(val==='si'?' t-si':'');
  document.getElementById(tipo+'-no').className='tog-btn'+(val==='no'?' t-no':'');
  const sec=document.getElementById('sec-'+tipo);
  if(val==='si'){
    sec.style.display='block';
    if(tipo==='pr'&&!document.getElementById('rows-pr').children.length) addPr();
    if(tipo==='inv') setTimeout(()=>document.getElementById('buscador').focus(),100);
  } else sec.style.display='none';
}

function filtrar(){
  const q=document.getElementById('buscador').value.toLowerCase().trim();
  const dd=document.getElementById('dropdown');
  if(!q){dd.style.display='none';dd.innerHTML='';return;}
  const res=TODOS.filter(a=>!invitados.find(i=>i.cod===a.cod)&&(a.nom.toLowerCase().includes(q)||a.cod.includes(q)));
  if(!res.length){dd.style.display='none';dd.innerHTML='';return;}
  dd.innerHTML=res.slice(0,25).map(a=>`
    <div class="drop-row" onmousedown="agregar('${a.cod}','${a.nom.replace(/'/g,"\\'")}','${a.turno||''}')">
      <div><div class="drop-name">${a.nom.split(' ').slice(0,3).join(' ')}</div><div class="drop-cod">${a.cod}</div></div>
      <div class="turno-pill">Turno ${a.turno||'—'}</div>
    </div>`).join('');
  dd.style.display='block';
}

function agregar(cod,nom,turno_orig){
  document.getElementById('buscador').value='';
  document.getElementById('dropdown').style.display='none';
  document.getElementById('dropdown').innerHTML='';
  invitados.push({cod,nom,turno:turno_orig,nota:''});
  renderInvitados();
}

function eliminarInv(cod){
  invitados=invitados.filter(a=>a.cod!==cod);
  renderInvitados();
}

function renderInvitados(){
  const c=document.getElementById('lista-inv');
  if(!invitados.length){
    c.innerHTML='<div class="empty-list">Busca y toca un alumno para agregarlo</div>';
    return;
  }
  c.innerHTML=invitados.map((a,i)=>`
    <div class="inv-item">
      <div class="inv-left">
        <div class="inv-name">${a.nom.split(' ').slice(0,2).join(' ')}</div>
        <div class="inv-cod">${a.cod}</div>
      </div>
      <div class="inv-pill">Turno ${a.turno||'—'}</div>
      <div class="nota-wrap">
        <div class="nota-display ${a.nota?'has-text':''}" id="nd_${i}" onclick="abrirNota(${i})">${a.nota||'Comentario...'}</div>
        <input type="text" class="nota-input-inv" id="ni_${i}"
          value="${a.nota}" placeholder="Comentario..."
          oninput="actualizarNotaInv('${a.cod}',this.value)"
          onblur="cerrarNota(${i})">
      </div>
      <button class="del-btn" onclick="eliminarInv('${a.cod}')">🗑</button>
    </div>`).join('');
}

function abrirNota(i){
  document.getElementById('nd_'+i).style.display='none';
  const inp=document.getElementById('ni_'+i);
  inp.style.display='block';
  inp.focus();
  inp.setSelectionRange(inp.value.length,inp.value.length);
}

function cerrarNota(i){
  const inp=document.getElementById('ni_'+i);
  const nd=document.getElementById('nd_'+i);
  if(!inp||!nd)return;
  const val=inp.value.trim();
  nd.textContent=val||'Comentario...';
  nd.className='nota-display'+(val?' has-text':'');
  inp.style.display='none';
  nd.style.display='flex';
}

function actualizarNotaInv(cod,val){
  const inv=invitados.find(a=>a.cod===cod);
  if(inv) inv.nota=val;
}

document.addEventListener('touchstart',cerrarDD);
document.addEventListener('mousedown',cerrarDD);
function cerrarDD(e){
  const dd=document.getElementById('dropdown');
  const bus=document.getElementById('buscador');
  if(dd&&bus&&!dd.contains(e.target)&&e.target!==bus) dd.style.display='none';
}

function addPr(){
  const c=document.getElementById('rows-pr');
  const n=prN++;
  const div=document.createElement('div');
  div.className='pr-card';
  div.innerHTML=`
    <input type="text" id="pn${n}" placeholder="Nombre completo del niño/a">
    <div class="pr-bottom">
      <div class="radio-box">
        <label><input type="radio" name="pr${n}" value="A"> Asistió</label>
        <label><input type="radio" name="pr${n}" value="F"> No asistió</label>
      </div>
      <textarea class="nota-pr" id="pt${n}" placeholder="Tel, edad, colegio, notas..."></textarea>
    </div>`;
  c.appendChild(div);
}

let ESTADO_ASIS={};
function marcarAFT(i,val){
  ESTADO_ASIS[i]=val;
  ['A','F','T'].forEach(v=>{
    const b=document.getElementById('a'+i+'-'+v);
    if(!b)return;
    b.className='aft-btn'+(v===val?(' '+v.toLowerCase()+'-on'):'');
  });
}

async function enviar(){
  const fecha=document.getElementById('fecha').value;
  const prof=document.getElementById('profesor').value;
  if(!fecha||!prof||!turno){alert('Completa fecha, profesor y turno.');return;}

  const lista=APT[turno]||[];
  const alumnos=lista.map((a,i)=>{
    const est=ESTADO_ASIS[i]||'';
    return{cod:a.cod,nom:a.nom,asistencia:est||'—'};
  });

  const prueba=[];
  document.querySelectorAll('.pr-card').forEach(card=>{
    const inp=card.querySelector('input[type=text]');
    const n=inp.id.replace('pn','');
    const nom=inp.value.trim();
    if(!nom)return;
    const s=card.querySelector('input[type=radio]:checked');
    prueba.push({nom,asistencia:s?s.value:'—',nota:document.getElementById('pt'+n).value});
  });

  const btn=document.getElementById('sbtn');
  btn.disabled=true;btn.innerHTML='⏳ Enviando...';

  try{
    await fetch(API,{method:'POST',mode:'no-cors',body:JSON.stringify({app:'asistencia',fecha,profesor:prof,turno,alumnos,invitados,prueba})});
    btn.innerHTML='✅ Asistencia enviada';btn.style.background='#085041';
    document.getElementById('resultado').innerHTML='<div class="ok-msg">✅ Registro guardado correctamente en Google Sheets</div>';
  }catch(e){
    btn.disabled=false;btn.innerHTML='📤 Enviar asistencia';
    alert('Error al enviar. Revisa tu conexión.');
  }
}

document.getElementById('fecha').valueAsDate=new Date();
init();
</script>
</body>
</html>
